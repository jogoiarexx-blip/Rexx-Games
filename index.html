<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rexx Games</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/favicon.png">
<script defer src="js/app.js"></script>
</head>
<body>

<header>
  <img class="brand-banner" src="assets/banner.jpg" alt="Rexx Games" width="1600" height="640">
</header>

<section id="banner">
  <a id="merchLink" href="https://example.com" target="_blank" rel="noopener">
    <span class="banner-tag" id="bannerTag">promo</span>
    <img id="merchImg" src="assets/banner-placeholder.png" alt="Banner promocional">
  </a>
</section>

<div class="controls">
  <input id="search" placeholder="buscar jogo...">
  <div class="filters" id="filters"></div>
</div>

<div id="games"></div>
<p id="emptyState">nenhum jogo encontrado com esse filtro.</p>

<footer>
  <img class="brand-mark" src="assets/logo.png" alt="Rexx Games">
  <p>feito por <span>Rexx</span> &middot; prateleira sempre em construção</p>
</footer>

</body>
</html>
